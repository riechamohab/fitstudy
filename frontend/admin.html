<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitStudy Admin</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">FitStudy</div>

        <a class="nav-item" href="dashboard.html">Dashboard</a>
        <a class="nav-item active" href="admin.html">Admin</a>

        <div style="margin-top:auto" class="nav-item">
            <div id="sidebarUserInfo">
                Admin
            </div>

            <button id="signOutBtn">
                Sign Out
            </button>
        </div>
    </aside>


    <main class="admin-container">

        <h1>Admin Dashboard</h1>

        <div class="stats-row">

            <div class="stat-mini">
                <h4 id="userCount">0</h4>
                <p>Total Users</p>
            </div>

            <div class="stat-mini">
                <h4>ADMIN</h4>
                <p>Access Level</p>
            </div>

        </div>


        <section class="admin-card">

            <h2>Users</h2>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created</th>
                    </tr>
                </thead>

                <tbody id="userTable">
                    
                </tbody>

            </table>

        </section>

    </main>


<script src="js/admin.js"></script>

</body>
</html>
